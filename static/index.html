<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/static/favicon.svg"><meta name="color-scheme" content="light"><title>Agent Phone</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/vendor/marked.js" defer></script><script src="/static/vendor/purify.min.js" defer></script><script src="/static/app.js" defer></script>
</head>
<body>
<svg class="svg-defs" aria-hidden="true"><defs>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H5v18h14V8zM14 3v6h5M8 13h8M8 17h6"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7V5h7l2 3h9v12H3z"/></symbol>
<symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 15v6h16v-6"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v13m-5-5 5 5 5-5M4 17v4h16v-4"/></symbol>
<symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4H4v16h6m4-13 5 5-5 5M8 12h12"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M19 11a7 7 0 0 0-12-5l-3 3m1 4a7 7 0 0 0 12 5l3-3"/></symbol>
<symbol id="i-work" viewBox="0 0 24 24"><path d="m5 7 5 5-5 5m8 0h6"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1"/></symbol>
<symbol id="i-link" viewBox="0 0 24 24"><path d="m10 13 4-4m-5 7-2 2a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m2 0 2-2a4 4 0 0 1 6 6l-4 4a4 4 0 0 1-6 0"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
</defs></svg>
<div class="drawer-shade" id="drawerShade" hidden></div>
<aside class="sidebar" id="sidebar" aria-label="对话列表">
  <a class="brand" href="/" aria-label="Agent Phone 首页"><span class="brand-mark"><svg><use href="#i-work"/></svg></span><span>Agent Phone<small>文件与任务</small></span></a>
  <button class="new-chat primary" id="newChatBtn"><svg><use href="#i-plus"/></svg>新对话</button>
  <label class="history-search"><svg><use href="#i-search"/></svg><input id="historySearch" placeholder="查找对话" aria-label="查找对话"></label>
  <div class="section-caption">最近对话</div>
  <nav id="convList" class="conv-list"></nav>
  <div class="sidebar-bottom"><span class="account-label"><i></i>个人工作区</span><div><button id="themeBtn" class="icon-btn" aria-label="切换外观" title="切换外观"><svg><use href="#i-sun"/></svg></button><button id="logoutBtn" class="icon-btn" title="退出登录" aria-label="退出登录" hidden><svg><use href="#i-logout"/></svg></button></div></div>
</aside>
<main class="main">
  <header class="topbar"><button id="menuBtn" class="icon-btn mobile-menu" aria-label="打开对话列表"><svg><use href="#i-menu"/></svg></button><div class="page-heading"><span class="heading-prefix">工作台 <b>/</b></span><span id="chatTitle">新对话</span><span id="runLabel" class="run-label">准备开始</span></div><div class="top-actions"><button id="exportBtn" class="icon-btn" title="导出对话" aria-label="导出对话"><svg><use href="#i-download"/></svg></button><button id="filesBtn" class="plain-btn" aria-label="打开工作区"><svg><use href="#i-folder"/></svg><span>工作区</span></button></div></header>
  <div class="chat-scroll" id="chatScroll"><div id="messages" class="messages" aria-live="polite" aria-relevant="additions text"></div></div>
  <div class="latest-wrap"><button id="latestBtn" class="latest-btn" hidden><svg><use href="#i-arrow"/></svg>回到最新</button></div>
  <div class="composer-wrap"><div class="connection-note" id="connectionNote" hidden><span></span><button id="reconnectBtn">重新连接</button></div><div class="attachment-list" id="attachmentList"></div>
    <form id="composer" class="composer"><textarea id="userInput" rows="1" maxlength="12000" aria-label="消息" placeholder="输入任务，或先引用一份文件…"></textarea><div class="composer-bottom"><button type="button" id="attachBtn" class="icon-btn" title="上传文件" aria-label="上传文件"><svg><use href="#i-plus"/></svg></button><span id="composerHint">Enter 发送，Shift + Enter 换行</span><button id="stopBtn" type="button" class="stop-btn" hidden><span class="stop-square"></span>停止</button><button type="submit" id="sendBtn" class="send-btn" title="发送" aria-label="发送"><svg><use href="#i-arrow"/></svg></button></div></form>
    <div class="composer-footer"><span class="model-badge"><i></i><span id="modelLabel">Agent Phone</span></span><span>文件保存在工作区</span></div>
  </div>
</main>
<aside id="workspacePanel" class="workspace-panel" aria-label="工作区文件">
  <header class="workspace-header"><div><h2>工作区<span id="fileCount" class="file-count">0</span></h2></div><div class="file-actions"><button class="icon-btn" id="refreshFilesBtn" aria-label="刷新文件" title="刷新文件"><svg><use href="#i-refresh"/></svg></button><button class="icon-btn" id="createFileBtn" aria-label="新建文件" title="新建文件"><svg><use href="#i-plus"/></svg></button><button class="icon-btn close-files" id="closeFilesBtn" aria-label="关闭工作区"><svg><use href="#i-close"/></svg></button></div></header>
  <div class="workspace-intro">本次任务用到的文件，都在这里。</div><label class="file-search"><svg><use href="#i-search"/></svg><input id="fileSearch" aria-label="筛选当前目录文件" placeholder="筛选文件"></label>
  <div class="breadcrumbs" id="breadcrumbs"></div><div id="fileList" class="file-list"></div><div id="uploadQueue" class="upload-queue" aria-live="polite"></div><button id="uploadFilesBtn" class="upload-area"><span class="upload-icon"><svg><use href="#i-upload"/></svg></span><strong>点击或拖入文件</strong><span>PDF、Word、文本、代码<br>每个最大 10 MB · 一次最多 10 个</span></button>
</aside>
<input id="fileInput" type="file" multiple hidden accept=".pdf,.docx,.txt,.md,.markdown,.csv,.tsv,.json,.jsonl,.yaml,.yml,.toml,.ini,.conf,.cfg,.log,.py,.js,.jsx,.ts,.tsx,.vue,.svelte,.html,.htm,.css,.scss,.c,.h,.cpp,.hpp,.java,.go,.rs,.rb,.php,.sh,.sql,.xml,.svg,.tex,.rst">
<div id="dropOverlay" class="drop-overlay" hidden><div><svg><use href="#i-upload"/></svg><strong>松开，上传到工作区</strong><span>上传后可直接加入对话</span></div></div>
<dialog id="changeDialog" class="file-dialog change-dialog" aria-labelledby="changeTitle"><form method="dialog" class="dialog-heading"><div><span class="section-caption">文件改动</span><h2 id="changeTitle">文件</h2></div><button class="icon-btn" aria-label="关闭改动记录"><svg><use href="#i-close"/></svg></button></form><div class="change-status" id="changeStatus"></div><div id="changeDiff" class="change-diff"></div><div class="dialog-footer"><span>仅展示这次任务记录到的改动，不会覆盖当前文件。</span><div><button id="changeCurrentBtn" class="plain-btn">打开当前文件</button></div></div></dialog>
<dialog id="fileDialog" class="file-dialog" aria-labelledby="fileTitle"><form method="dialog" class="dialog-heading"><div><span class="section-caption" id="fileMode">文件预览</span><h2 id="fileTitle">文件</h2></div><button class="icon-btn" aria-label="关闭文件"><svg><use href="#i-close"/></svg></button></form><input id="fileName" class="file-name" aria-label="文件名" placeholder="例如 notes/idea.md" hidden><div class="file-view-tabs" id="fileViewTabs" hidden><button id="sourceTab" aria-pressed="true">原文</button><button id="previewTab" aria-pressed="false">阅读</button></div><textarea id="fileContent" class="file-content" spellcheck="false" aria-label="文件内容" readonly></textarea><div id="filePreview" class="file-preview message assistant" hidden></div><div class="dialog-footer"><span id="fileStatus"></span><div><button id="deleteFileBtn" class="text-danger">删除</button><button id="downloadFileBtn" class="plain-btn">下载</button><button id="referenceFileBtn" class="plain-btn"><svg><use href="#i-link"/></svg>加入对话</button><button id="editFileBtn" class="plain-btn">编辑</button><button id="saveFileBtn" class="primary" hidden>保存</button></div></div></dialog>
<div id="loginPage" class="login-page" hidden><form id="loginForm" class="login-card"><span class="brand-mark"><svg><use href="#i-file"/></svg></span><h1>Agent Phone</h1><p>登录个人工作区</p><label for="loginPw" id="loginLabel">口令</label><input id="loginPw" type="password" autocomplete="current-password" required><div id="loginErr" class="login-error" role="alert"></div><button id="loginBtn" class="primary">登录</button></form></div>
<div class="toast" id="toast" role="status" hidden></div>
</body></html>
