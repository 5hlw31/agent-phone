<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AI 助手</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
/* ------------------------------------------------------------------ */
/* Reset & tokens                                                     */
/* ------------------------------------------------------------------ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0d1117;
  --surface:   #161b22;
  --border:    #30363d;
  --text:      #e6edf3;
  --text-dim:  #8b949e;
  --accent:    #58a6ff;
  --accent2:   #3fb950;
  --user-bg:   #1f2937;
  --tool-bg:   #1a1a2e;
  --tool-border:#3a3a5c;
  --danger:    #f85149;
  --radius:    12px;
  --font:      -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "SF Mono", "Fira Code", "Cascadia Code", monospace;
}

html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  display: flex;
}

/* ------------------------------------------------------------------ */
/* Sidebar                                                            */
/* ------------------------------------------------------------------ */
.sidebar {
  width: 280px;
  min-width: 280px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  transition: transform 0.2s ease;
}
.sidebar-header {
  padding: 16px;
  border-bottom: 1px solid var(--border);
}
.sidebar-header h2 { font-size: 1rem; margin-bottom: 10px; }
.btn {
  width: 100%;
  padding: 10px 16px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text);
  font-size: 0.875rem;
  cursor: pointer;
  transition: background 0.15s;
  text-align: center;
}
.btn:hover { background: var(--border); }
.btn-accent { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-accent:hover { opacity: 0.85; }
.conv-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}
.conv-item {
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.8125rem;
  color: var(--text-dim);
  margin-bottom: 2px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.conv-item:hover { background: var(--border); color: var(--text); }
.conv-item.active { background: var(--border); color: var(--text); }
.conv-item .del-btn {
  opacity: 0;
  background: none;
  border: none;
  color: var(--danger);
  cursor: pointer;
  font-size: 1rem;
  padding: 0 4px;
}
.conv-item:hover .del-btn { opacity: 1; }
.del-btn:hover { opacity: 1 !important; }

/* ------------------------------------------------------------------ */
/* Main chat area                                                     */
/* ------------------------------------------------------------------ */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.chat-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.875rem;
}
.chat-header .menu-btn {
  display: none;
  background: none;
  border: none;
  color: var(--text);
  font-size: 1.25rem;
  cursor: pointer;
  padding: 4px;
}
.chat-header .spacer { flex: 1; }
.chat-header .gear-btn {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 1.1rem;
  cursor: pointer;
  padding: 4px;
  margin-left: auto;
}
.chat-header .gear-btn:hover { color: var(--text); }
.chat-header .gear-btn.has-token { color: var(--accent2); }
.tools-badge {
  font-size: 0.6875rem;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--tool-bg);
  border: 1px solid var(--tool-border);
  color: var(--text-dim);
}
.tools-badge span { color: var(--accent2); }

/* Messages */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.msg {
  max-width: 85%;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.msg.user { align-self: flex-end; }
.msg.assistant { align-self: flex-start; }
.msg .bubble {
  padding: 10px 14px;
  border-radius: var(--radius);
  line-height: 1.6;
  font-size: 0.875rem;
  word-break: break-word;
}
.msg.user .bubble {
  background: var(--accent);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.msg.assistant .bubble {
  background: var(--surface);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
}
.msg .bubble p { margin: 0 0 6px; }
.msg .bubble p:last-child { margin-bottom: 0; }
.msg .bubble pre {
  background: var(--bg);
  border-radius: 6px;
  padding: 10px 12px;
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: 0.8125rem;
  margin: 8px 0;
}
.msg .bubble code {
  font-family: var(--font-mono);
  font-size: 0.8125rem;
}
.msg .bubble :not(pre) > code {
  background: var(--bg);
  padding: 1px 5px;
  border-radius: 4px;
}

/* Tool call card */
.tool-card {
  align-self: flex-start;
  max-width: 90%;
  background: var(--tool-bg);
  border: 1px solid var(--tool-border);
  border-radius: var(--radius);
  padding: 10px 14px;
  font-size: 0.8125rem;
  margin: 4px 0;
}
.tool-card .tool-header {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
}
.tool-card .tool-header .icon { font-size: 1rem; }
.tool-card .tool-header .name { color: var(--accent); font-weight: 600; }
.tool-card .tool-detail pre {
  background: var(--bg);
  border-radius: 6px;
  padding: 8px 10px;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  overflow-x: auto;
  max-height: 150px;
  overflow-y: auto;
  margin: 0;
  white-space: pre-wrap;
  word-break: break-all;
}
.tool-card .tool-status {
  font-size: 0.6875rem;
  margin-left: auto;
}
.tool-card .tool-status.ok { color: var(--accent2); }
.tool-card .tool-status.err { color: var(--danger); }

/* Input area */
.input-area {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  align-items: flex-end;
}
.input-area textarea {
  flex: 1;
  resize: none;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 0.875rem;
  font-family: var(--font);
  color: var(--text);
  background: var(--surface);
  line-height: 1.4;
  max-height: 120px;
  outline: none;
}
.input-area textarea:focus { border-color: var(--accent); }
.input-area button {
  padding: 10px 18px;
  border: none;
  border-radius: 10px;
  background: var(--accent);
  color: #fff;
  font-size: 0.875rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: opacity 0.15s;
}
.input-area button:disabled { opacity: 0.5; cursor: default; }
.input-area button:not(:disabled):hover { opacity: 0.85; }

/* Typing indicator */
.typing { align-self: flex-start; padding: 10px 14px; }
.typing span {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--text-dim);
  animation: bounce 1.2s infinite;
  margin: 0 1px;
}
.typing span:nth-child(2) { animation-delay: 0.15s; }
.typing span:nth-child(3) { animation-delay: 0.3s; }
@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); }
  30% { transform: translateY(-6px); }
}

/* empty state */
.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-dim);
  gap: 8px;
}
.empty-state .emoji { font-size: 3rem; margin-bottom: 8px; }

/* ------------------------------------------------------------------ */
/* Login page                                                         */
/* ------------------------------------------------------------------ */
.login-page {
  display: none;
  position: fixed; inset: 0;
  background: var(--bg);
  z-index: 100;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}
.login-page.show { display: flex; }
.login-card {
  width: 90%;
  max-width: 320px;
  text-align: center;
}
.login-emoji { font-size: 3rem; margin-bottom: 8px; }
.login-card h2 { font-size: 1.25rem; margin-bottom: 4px; }
.login-desc { color: var(--text-dim); font-size: 0.8125rem; margin-bottom: 20px; }
.login-card input {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--text);
  font-size: 0.9375rem;
  text-align: center;
  outline: none;
  margin-bottom: 10px;
}
.login-card input:focus { border-color: var(--accent); }
.login-card .btn { margin-top: 4px; }
.login-err {
  color: var(--danger);
  font-size: 0.75rem;
  margin-top: 8px;
  min-height: 18px;
}

/* ------------------------------------------------------------------ */
/* Settings modal                                                     */
/* ------------------------------------------------------------------ */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 20;
  align-items: center;
  justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  width: 90%;
  max-width: 360px;
}
.modal h3 { font-size: 0.9375rem; margin-bottom: 12px; }
.modal label { font-size: 0.75rem; color: var(--text-dim); display: block; margin-bottom: 4px; }
.modal input {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--text);
  font-size: 0.8125rem;
  font-family: var(--font-mono);
  outline: none;
  margin-bottom: 12px;
}
.modal input:focus { border-color: var(--accent); }
.modal .modal-hint {
  font-size: 0.6875rem;
  color: var(--text-dim);
  margin-bottom: 12px;
  line-height: 1.5;
}
.modal .btn-row { display: flex; gap: 8px; }
.modal .btn-row .btn { flex: 1; }
.modal .status-msg {
  font-size: 0.75rem;
  margin-top: 8px;
  text-align: center;
}
.modal .status-msg.ok { color: var(--accent2); }
.modal .status-msg.err { color: var(--danger); }

/* ------------------------------------------------------------------ */
/* File browser                                                       */
/* ------------------------------------------------------------------ */
.file-browser, .file-viewer {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.fb-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  font-size: 0.8125rem;
}
.fb-header .fb-back, .fb-header .fb-close, .fb-header .fb-action {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 1rem;
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 4px;
}
.fb-header .fb-back:hover, .fb-header .fb-close:hover, .fb-header .fb-action:hover { color: var(--text); background: var(--border); }
.fb-header .fb-action.danger:hover { color: var(--danger); }
.fb-header .fb-path {
  flex: 1;
  color: var(--accent);
  font-family: var(--font-mono);
  font-size: 0.75rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.fb-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}
.fb-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.8125rem;
}
.fb-item:hover { background: var(--border); }
.fb-item .fb-icon { font-size: 1.1rem; flex-shrink: 0; }
.fb-item .fb-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fb-item .fb-meta { color: var(--text-dim); font-size: 0.6875rem; flex-shrink: 0; }
.fb-item .fb-del {
  opacity: 0;
  background: none;
  border: none;
  color: var(--danger);
  font-size: 1rem;
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 4px;
  flex-shrink: 0;
}
.fb-item:hover .fb-del { opacity: 1; }
.fb-item .fb-del:hover { background: var(--border); }
.fv-content-edit {
  flex: 1;
  width: 100%;
  padding: 14px;
  font-family: var(--font-mono);
  font-size: 0.8125rem;
  line-height: 1.5;
  background: var(--bg);
  color: var(--text);
  border: none;
  resize: none;
  outline: none;
}
.fb-empty {
  text-align: center;
  color: var(--text-dim);
  padding: 24px;
  font-size: 0.8125rem;
}
.fv-content {
  flex: 1;
  overflow: auto;
  padding: 14px;
  font-family: var(--font-mono);
  font-size: 0.8125rem;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-all;
}

/* ------------------------------------------------------------------ */
/* Mobile                                                             */
/* ------------------------------------------------------------------ */
@media (max-width: 640px) {
  .sidebar {
    position: fixed;
    z-index: 10;
    top: 0; left: 0; bottom: 0;
    transform: translateX(-100%);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 9;
  }
  .sidebar-overlay.show { display: block; }
  .chat-header .menu-btn { display: block; }
  .msg { max-width: 92%; }
}
</style>
</head>
<body>

<!-- Login page -->
<div class="login-page" id="loginPage">
  <div class="login-card">
    <div class="login-emoji">🤖</div>
    <h2>Agent 助手</h2>
    <p class="login-desc">输入密码登录你的个人助手</p>
    <input type="password" id="loginPw" placeholder="密码" autocomplete="current-password">
    <button class="btn btn-accent" id="loginBtn">登录</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- Sidebar overlay (mobile) -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- Settings modal -->
<div class="modal-overlay" id="settingsOverlay">
  <div class="modal">
    <h3>⚙ 设置</h3>
    <label for="tokenInput">访问令牌</label>
    <input type="password" id="tokenInput" placeholder="粘贴 AUTH_TOKEN…" autocomplete="off">
    <div class="modal-hint">
      服务器未要求认证可不填。<br>
      令牌仅保存在你的浏览器中。
    </div>
    <div class="btn-row">
      <button class="btn" id="settingsCancel">取消</button>
      <button class="btn btn-accent" id="settingsSave">保存</button>
    </div>
    <div class="status-msg" id="settingsStatus"></div>
  </div>
</div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h2>🤖 AI 助手</h2>
    <button class="btn btn-accent" id="newChatBtn">+ 新对话</button>
    <button class="btn" id="filesBtn" style="margin-top:6px;">📁 云盘</button>
  </div>
  <div class="conv-list" id="convList"></div>
</aside>

<!-- Main -->
<div class="main">
  <header class="chat-header">
    <button class="menu-btn" id="menuBtn" title="Menu">☰</button>
    <span id="chatTitle">AI 助手</span>
    <span class="tools-badge"><span id="toolCount">4</span> 个工具</span>
    <button class="gear-btn" id="gearBtn" title="Settings">⚙</button>
  </header>

  <div class="messages" id="messages">
    <div class="empty-state">
      <div class="emoji">🤖</div>
      <div>有问题尽管问 — 我可以搜网页、跑命令、读写文件。</div>
    </div>
  </div>

  <!-- File browser (hidden by default) -->
  <div class="file-browser" id="fileBrowser" style="display:none;">
    <div class="fb-header">
      <button class="fb-back" id="fbBack" title="返回">←</button>
      <span class="fb-path" id="fbPath">/workspace</span>
      <button class="fb-action" id="fbCreate" title="新建">＋</button>
      <button class="fb-action" id="fbUpload" title="上传">↑</button>
      <input type="file" id="fbUploadInput" style="display:none" multiple>
      <button class="fb-close" id="fbClose" title="关闭">✕</button>
    </div>
    <div class="fb-list" id="fbList"></div>
  </div>

  <!-- File viewer (hidden by default) -->
  <div class="file-viewer" id="fileViewer" style="display:none;">
    <div class="fb-header">
      <button class="fb-back" id="fvBack" title="返回">←</button>
      <span class="fb-path" id="fvName">file.txt</span>
      <button class="fb-action" id="fvEdit" title="编辑">✎</button>
      <button class="fb-action" id="fvDownload" title="下载">⬇</button>
      <button class="fb-action" id="fvDelete" title="删除">🗑</button>
      <button class="fb-close" id="fvClose" title="关闭">✕</button>
    </div>
    <textarea class="fv-content-edit" id="fvContentEdit" style="display:none;"></textarea>
    <pre class="fv-content" id="fvContent"></pre>
  </div>

  <!-- Create file modal -->
  <div class="modal-overlay" id="createOverlay">
    <div class="modal">
      <h3 id="createTitle">新建文件</h3>
      <label for="createName">文件名</label>
      <input type="text" id="createName" placeholder="例如 notes.md 或 新建文件夹/">
      <label for="createContent">内容（可选）</label>
      <textarea id="createContent" rows="5" placeholder="文件内容…" style="width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px;font-family:var(--font-mono);font-size:0.8125rem;resize:vertical;"></textarea>
      <div class="btn-row">
        <button class="btn" id="createCancel">取消</button>
        <button class="btn btn-accent" id="createConfirm">创建</button>
      </div>
      <div class="status-msg" id="createStatus"></div>
    </div>
  </div>

  <div class="input-area">
    <textarea id="userInput" rows="1" placeholder="输入消息…" autofocus></textarea>
    <button id="sendBtn">发送</button>
    <button id="stopBtn" style="display:none;background:var(--danger);">停止</button>
  </div>
</div>

<script>
/* ================================================================== */
/* State                                                               */
/* ================================================================== */
const STATE = {
  conversations: [],
  activeId: null,
  messages: [],
  streaming: false,
  authToken: '',       // loaded from localStorage
};

/* ================================================================== */
/* Auth token helpers                                                   */
/* ================================================================== */
function getAuthHeaders() {
  const h = { 'Content-Type': 'application/json' };
  if (STATE.authToken) {
    h['Authorization'] = `Bearer ${STATE.authToken}`;
  }
  return h;
}

function loadToken() {
  STATE.authToken = localStorage.getItem('agent_token') || '';
}

function saveToken(token) {
  STATE.authToken = token;
  if (token) {
    localStorage.setItem('agent_token', token);
  } else {
    localStorage.removeItem('agent_token');
  }
  updateGearIcon();
}

function updateGearIcon() {
  const btn = $('#gearBtn');
  if (STATE.authToken) {
    btn.classList.add('has-token');
    btn.title = '设置 (已配置令牌 ✓)';
  } else {
    btn.classList.remove('has-token');
    btn.title = '设置';
  }
}

/* ================================================================== */
/* DOM refs                                                            */
/* ================================================================== */
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

const messagesEl     = $('#messages');
const userInput      = $('#userInput');
const sendBtn        = $('#sendBtn');
const stopBtn        = $('#stopBtn');
const convList       = $('#convList');
const menuBtn        = $('#menuBtn');
const sidebar        = $('#sidebar');
const overlay        = $('#sidebarOverlay');
const chatTitle      = $('#chatTitle');
const gearBtn        = $('#gearBtn');
const settingsOverlay = $('#settingsOverlay');
const tokenInput     = $('#tokenInput');
const settingsStatus = $('#settingsStatus');

/* ================================================================== */
/* Helpers                                                             */
/* ================================================================== */
function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function renderMarkdown(text) {
  if (!text) return '';
  try {
    const raw = marked.parse(text);
    return DOMPurify.sanitize(raw, { ALLOWED_TAGS: [
      'p','br','strong','em','u','s','del','a','img',
      'h1','h2','h3','h4','h5','h6',
      'ul','ol','li','blockquote',
      'pre','code','table','thead','tbody','tr','th','td',
      'hr','span','div',
    ]});
  } catch {
    return escapeHtml(text);
  }
}

function scrollBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

/* ================================================================== */
/* Render                                                              */
/* ================================================================== */
function createMsgEl(role, content) {
  const el = document.createElement('div');
  el.className = `msg ${role}`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = renderMarkdown(content);
  el.appendChild(bubble);
  return el;
}

function createToolCard(callId, toolName, args, result) {
  const el = document.createElement('div');

  // web_search: render results cleanly, no parameter dump
  if (toolName === 'web_search') {
    el.className = 'msg assistant';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    const status = result.startsWith('[ERROR') || result.startsWith('[TIMEOUT')
      ? '🔍 搜索失败'
      : '🔍 搜索结果';
    bubble.innerHTML = `<div style="font-weight:600;margin-bottom:6px;color:var(--text-dim);font-size:0.75rem;">${status}</div>`
      + renderMarkdown(result.replace(/\[ERROR\]\s*/g, '').replace(/\[TIMEOUT\]\s*/g, ''));
    el.appendChild(bubble);
    el.id = `tool-${callId}`;
    return el;
  }

  // other tools: compact card without collapse/expand
  el.className = 'tool-card';
  el.id = `tool-${callId}`;
  const statusClass = result.startsWith('[ERROR') || result.startsWith('[BLOCKED') || result.startsWith('[TIMEOUT')
    ? 'err' : 'ok';
  const iconMap = {
    run_command: '💻', read_file: '📖', write_file: '✏️', edit_file: '✂️',
    search_code: '🔎', list_files: '📂', git_status: '📋', git_diff: '📊',
    git_log: '📜', git_commit: '✅', create_pptx: '📊', create_pdf: '📄',
    web_search: '🌐', web_fetch: '🌍', code_exec: '🐍',
  };
  const statusText = statusClass === 'ok' ? '✓' : '✗';
  const shortResult = String(result).slice(0, 500);
  el.innerHTML = `
    <div class="tool-header">
      <span class="icon">${iconMap[toolName] || '🔧'}</span>
      <span class="name">${escapeHtml(toolName)}</span>
      <span class="tool-status ${statusClass}">${statusText}</span>
    </div>
    <div class="tool-detail"><pre>${escapeHtml(shortResult)}</pre></div>`;
  return el;
}

function createTypingEl() {
  const el = document.createElement('div');
  el.className = 'typing';
  el.id = 'typingIndicator';
  el.innerHTML = '<span></span><span></span><span></span>';
  return el;
}

function removeTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

function renderConvList() {
  convList.innerHTML = STATE.conversations.map(c =>
    `<div class="conv-item${c.id === STATE.activeId ? ' active' : ''}" data-id="${c.id}">
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(c.title)}</span>
      <button class="del-btn" data-del="${c.id}" title="删除">×</button>
    </div>`
  ).join('');

  // click → switch conversation
  convList.querySelectorAll('.conv-item').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.dataset.del) return;
      loadConversation(el.dataset.id);
    });
  });

  // delete button
  convList.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const id = btn.dataset.del;
      await fetch(`/api/conversations/${id}`, { method: 'DELETE', headers: getAuthHeaders() });
      STATE.conversations = STATE.conversations.filter(c => c.id !== id);
      if (STATE.activeId === id) {
        STATE.activeId = null;
        STATE.messages = [];
        renderMessages();
      }
      renderConvList();
      closeSidebar();
    });
  });
}

function renderMessages() {
  messagesEl.innerHTML = '';
  if (!STATE.messages.length) {
    messagesEl.innerHTML = `
      <div class="empty-state">
        <div class="emoji">🤖</div>
        <div>Ask me anything — I can search the web, run commands, and manage files.</div>
      </div>`;
    return;
  }
  for (let i = 0; i < STATE.messages.length; i++) {
    const msg = STATE.messages[i];
    if (msg._type === 'tool') {
      messagesEl.appendChild(createToolCard(
        msg.call_id || `${msg.tool_name}_${i}`,
        msg.tool_name,
        msg.arguments,
        msg.result
      ));
    } else {
      messagesEl.appendChild(createMsgEl(msg.role, msg.content));
    }
  }
  scrollBottom();
}

/* ------------------------------------------------------------------ */
/* SSE streaming sender                                                */
/* ------------------------------------------------------------------ */
let abortController = null;

function stopStreaming() {
  STATE.streaming = false;
  if (abortController) {
    abortController.abort();
    abortController = null;
  }
  sendBtn.style.display = '';
  stopBtn.style.display = 'none';
  sendBtn.disabled = false;
  userInput.disabled = false;
  userInput.focus();
  removeTyping();
}

stopBtn.addEventListener('click', () => {
  stopStreaming();
});

/* SSE streaming sender                                                */
/* ------------------------------------------------------------------ */
async function sendMessage(text) {
  if (STATE.streaming || !text.trim()) return;

  STATE.streaming = true;
  sendBtn.style.display = 'none';
  stopBtn.style.display = '';
  sendBtn.disabled = true;
  userInput.disabled = true;
  userInput.value = '';
  userInput.style.height = 'auto';

  // clear empty state
  const es = document.querySelector('.empty-state');
  if (es) es.remove();
  removeTyping();

  // user bubble
  messagesEl.appendChild(createMsgEl('user', text));
  scrollBottom();

  // typing
  messagesEl.appendChild(createTypingEl());
  scrollBottom();

  // assistant bubble (accumulated streaming)
  let assistantEl = null;
  let assistantContent = '';

  function ensureAssistantEl() {
    if (assistantEl) return;
    removeTyping();
    assistantEl = document.createElement('div');
    assistantEl.className = 'msg assistant';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.id = 'streamingBubble';
    assistantEl.appendChild(bubble);
    messagesEl.appendChild(assistantEl);
  }

  function finalizeAssistant() {
    if (!assistantEl) return;
    const bubble = assistantEl.querySelector('.bubble');
    bubble.removeAttribute('id');
    bubble.innerHTML = renderMarkdown(assistantContent);
    assistantEl = null;
    assistantContent = '';
  }

  abortController = new AbortController();

  try {
    const res = await fetch('/api/chat/send', {
      method: 'POST',
      headers: getAuthHeaders(),
      body: JSON.stringify({
        conversation_id: STATE.activeId || null,
        message: text,
      }),
      signal: abortController.signal,
    });

    if (!res.ok) {
      const errText = await res.text();
      throw new Error(errText || `HTTP ${res.status}`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let currentEvent = 'message';

    while (STATE.streaming) {
      const { done, value } = await reader.read();
      if (done || !STATE.streaming) break;

      buffer += decoder.decode(value, { stream: true });

      while (true) {
        const nl = buffer.indexOf('\n');
        if (nl === -1) break;
        const line = buffer.slice(0, nl);
        buffer = buffer.slice(nl + 1);

        if (line === '') {
          // empty line = end of event (SSE spec)
          currentEvent = 'message';
          continue;
        }

        if (line.startsWith('event: ')) {
          currentEvent = line.slice(7).trim();
          continue;
        }

        if (!line.startsWith('data: ')) continue;

        const dataStr = line.slice(6);
        let data;
        try { data = JSON.parse(dataStr); } catch { continue; }

        switch (currentEvent) {
          case 'delta':
            removeTyping();
            ensureAssistantEl();
            assistantContent += data.content || '';
            const bubble = document.getElementById('streamingBubble');
            if (bubble) {
              bubble.innerHTML = renderMarkdown(assistantContent);
            }
            scrollBottom();
            break;

          case 'tool_call':
            removeTyping();
            finalizeAssistant();
            messagesEl.appendChild(createToolCard(
              data.call_id || data.tool_name,
              data.tool_name,
              data.arguments,
              '执行中…'
            ));
            scrollBottom();
            break;

          case 'tool_result': {
            const cardId = data.call_id || data.tool_name;
            const card = document.getElementById(`tool-${cardId}`);
            if (!card) break;
            // web_search: replace entire card with rendered result
            if (data.tool_name === 'web_search') {
              const newCard = createToolCard(cardId, data.tool_name, {}, data.result);
              card.replaceWith(newCard);
            } else {
              const resultPre = card.querySelector('.tool-detail pre');
              if (resultPre) {
                resultPre.textContent = String(data.result || '(empty)').slice(0, 500);
              }
            }
            scrollBottom();
            break;
          }

          case 'error':
            removeTyping();
            finalizeAssistant();
            messagesEl.appendChild(createMsgEl('assistant', `⚠️ ${escapeHtml(data.message)}`));
            scrollBottom();
            break;

          case 'done':
            finalizeAssistant();
            STATE.activeId = data.conversation_id;
            await loadConversations();
            // reload current conversation to get clean state
            if (STATE.activeId) {
              await loadConversation(STATE.activeId);
            }
            chatTitle.textContent = text.slice(0, 40).replace(/\n/g, ' ');
            break;
        }
      }
    }
  } catch (err) {
    if (err.name === 'AbortError') {
      // user clicked stop — do nothing, already handled in stopStreaming()
      return;
    }
    removeTyping();
    finalizeAssistant();
    messagesEl.appendChild(createMsgEl('assistant', `❌ ${escapeHtml(err.message || '连接失败')}`));
    scrollBottom();
  } finally {
    abortController = null;
    STATE.streaming = false;
    sendBtn.style.display = '';
    stopBtn.style.display = 'none';
    sendBtn.disabled = false;
    userInput.disabled = false;
    userInput.focus();
  }
}

/* ---------- helpers ---------- */

function fmtSize(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  return (b / 1048576).toFixed(1) + ' MB';
}

function fileIcon(name, isDir) {
  if (isDir) return '📁';
  if (/\.(md|txt|log)$/i.test(name)) return '📝';
  if (/\.(py|js|ts|go|rs|java|c|cpp|sh)$/i.test(name)) return '💻';
  if (/\.(json|yaml|yml|toml|ini|cfg)$/i.test(name)) return '⚙';
  if (/\.(html|css|svg)$/i.test(name)) return '🌐';
  return '📄';
}

/* ---------- directory listing ---------- */

async function loadDir(dirPath) {
  fbDir = dirPath;
  fbPath.textContent = dirPath.replace('/opt/agent/', '~/');
  fbBack.style.visibility = (fbHist.length === 0) ? 'hidden' : '';

  fbList.innerHTML = '<div class="fb-empty">加载中…</div>';

  try {
    const res = await fetch('/api/files?path=' + encodeURIComponent(dirPath), { headers: getAuthHeaders() });
    if (!res.ok) throw new Error('HTTP ' + res.status + (res.status === 401 ? ' (请先设置令牌)' : ''));
    const data = await res.json();

    if (data.type !== 'dir') {
      fbList.innerHTML = '<div class="fb-empty">不是目录</div>';
      return;
    }
    if (!data.entries || !data.entries.length) {
      fbList.innerHTML = '<div class="fb-empty">空目录 — 点 ＋ 新建文件</div>';
      return;
    }

    fbList.innerHTML = data.entries.map(e => {
      const name = e.name;
      const icon = fileIcon(name, e.is_dir);
      const meta = e.is_dir ? '目录' : fmtSize(e.size);
      return `<div class="fb-item" data-name="${escapeHtml(name)}" data-is-dir="${e.is_dir}">
        <span class="fb-icon">${icon}</span>
        <span class="fb-name">${escapeHtml(name)}${e.is_dir ? '/' : ''}</span>
        <span class="fb-meta">${meta}</span>
        <button class="fb-del">×</button>
      </div>`;
    }).join('');

    // bind events
    fbList.querySelectorAll('.fb-item').forEach(el => {
      el.addEventListener('click', function(e) {
        if (e.target.classList.contains('fb-del')) return;
        const name = this.dataset.name;
        const full = dirPath + '/' + name;
        if (this.dataset.isDir === 'true') {
          fbHist.push(dirPath);
          loadDir(full);
        } else {
          openFile(full, name);
        }
      });
      const del = el.querySelector('.fb-del');
      if (del) del.addEventListener('click', function(e) {
        e.stopPropagation();
        removeFile(dirPath + '/' + this.parentElement.dataset.name);
      });
    });

  } catch (err) {
    fbList.innerHTML = '<div class="fb-empty">⚠ ' + escapeHtml(err.message) + '</div>';
  }
}

    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    fvContentEl.textContent = data.content || '(空文件)';
  } catch (err) {
    fvContentEl.textContent = '⚠ 读取失败: ' + err.message;
  }
}

async function removeFile(path) {
  if (!confirm('确定删除 ' + path.split('/').pop() + '？')) return;
  try {
    const res = await fetch('/api/files?path=' + encodeURIComponent(path), { method: 'DELETE', headers: getAuthHeaders() });

    loadDir(fbDir);

}

    e.preventDefault();

      const res = await fetch('/api/files', { method: 'POST', headers: getAuthHeaders(), body: JSON.stringify({ path: fbViewPath, content: fvContentEdit.value }) });
      if (!res.ok) { const er = await res.json(); throw new Error(er.detail); }
      fvContentEl.textContent = fvContentEdit.value;
      fvContentEl.style.display = 'block';
      fvContentEdit.style.display = 'none';
    } catch (err) { alert('保存失败: ' + err.message); }
  }
  if (e.key === 'Escape') {
    fvContentEl.style.display = 'block';
    fvContentEdit.style.display = 'none';

});

/* ---------- download ---------- */

$('#fvDownload').addEventListener('click', function() {
  if (!fbViewPath) return;
  fetch('/api/files/download?path=' + encodeURIComponent(fbViewPath), { headers: getAuthHeaders() })
    .then(function(r) { if (!r.ok) throw new Error('fail'); return r.blob(); })
    .then(function(blob) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = fbViewPath.split('/').pop();
      a.click();
      URL.revokeObjectURL(a.href);
    })
    .catch(function() { alert('下载失败'); });
});

/* ================================================================== */
/* Init                                                                */
/* ================================================================== */
async function init() {
  loadToken();
  updateGearIcon();

  // Check if login is required
  try {
    const res = await fetch('/api/auth/status');
    const status = await res.json();

    if (status.login_required) {
      if (!STATE.authToken) {
        // No token → show login
        showLogin();
        return;
      }
      // Verify token is still valid
      const checkRes = await fetch('/api/auth/check', { headers: getAuthHeaders() });
      const check = await checkRes.json();
      if (!check.logged_in) {
        saveToken('');
        showLogin();
        return;
      }
    }
  } catch (err) {
    // Server unreachable — still try to load
  }

  // Logged in or auth not required
  hideLogin();
  await loadConversations();
  if (STATE.conversations.length) {
    await loadConversation(STATE.conversations[0].id);
  }
  userInput.focus();
}

function updateToolCount(n) {
  const el = $('#toolCount');
  if (el) el.textContent = n;
}

// check health
fetch('/api/health', { headers: getAuthHeaders() })
  .then(r => r.json())
  .then(d => {
    $('#toolCount').textContent = d.tool_count || 11;
  })
  .catch(() => {});

init();
</script>
